<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склейка картинок в сетку 16:9</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h1 class="text-2xl font-bold mb-2 text-center">Склейка картинок в сетку 3×3</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Загрузите до 10 картинок, чтобы собрать их в единое изображение формата 16:9.</p>

        <!-- Область загрузки -->
        <div class="mb-6">
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-6 cursor-pointer transition bg-slate-900/50 hover:bg-slate-800/50">
                <svg class="w-10 h-10 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-sm font-medium">Выберите или перетащите картинки (до 10 шт.)</span>
                <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
            </label>
        </div>

        <!-- Список превью -->
        <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6 hidden">
            <!-- Сюда добавляются превью -->
        </div>

        <!-- Кнопка склейки -->
        <button id="stitchBtn" onclick="stitchImages()" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold py-3 rounded-xl transition shadow-lg hidden">
            Собрать в сетку 3×3
        </button>

        <!-- Результат -->
        <div id="resultContainer" class="mt-8 hidden flex flex-col items-center border-t border-slate-800 pt-6">
            <h2 class="text-lg font-semibold mb-4">Результат склейки:</h2>
            <div class="max-h-96 overflow-hidden rounded-lg border border-slate-700 mb-4 shadow-md">
                <img id="resultImage" class="max-w-full object-contain" alt="Результат">
            </div>
            <a id="downloadBtn" download="grid-stitched-image.png" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg inline-flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Скачать готовую картинку
            </a>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        const maxFiles = 10;
        const totalWidth = 1920;  // Итоговая ширина 16:9
        const totalHeight = 1080; // Итоговая высота 16:9

        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const stitchBtn = document.getElementById('stitchBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            for (let file of files) {
                if (selectedFiles.length >= maxFiles) {
                    alert(`Можно загрузить не более ${maxFiles} картинок.`);
                    break;
                }
                selectedFiles.push(file);
            }
            fileInput.value = '';
            updatePreview();
        });

        function updatePreview() {
            previewContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                previewContainer.classList.remove('hidden');
                stitchBtn.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
                stitchBtn.classList.add('hidden');
                resultContainer.classList.add('hidden');
                return;
            }

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative group aspect-video bg-slate-800 rounded-lg overflow-hidden border border-slate-700';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 hover:bg-red-500 text-white rounded-full p-1 opacity-80 group-hover:opacity-100 transition shadow">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeImage = function(index) {
            selectedFiles.splice(index, 1);
            updatePreview();
            resultContainer.classList.add('hidden');
        }

        async function stitchImages() {
            if (selectedFiles.length === 0) return;

            stitchBtn.textContent = 'Обработка...';
            stitchBtn.disabled = true;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Фиксируем холст в разрешении 1920x1080 (16:9)
            canvas.width = totalWidth;
            canvas.height = totalHeight;

            // Заливаем фон черным (или можете изменить на белый/прозрачный)
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, totalWidth, totalHeight);

            const cols = 3;
            const rows = 3; // Сетка 3 на 3
            const cellWidth = totalWidth / cols;
            const cellHeight = totalHeight / rows;

            try {
                for (let i = 0; i < Math.min(selectedFiles.length, 9); i++) {
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        const reader = new FileReader();
                        
                        reader.onload = (e) => { img.src = e.target.result; };
                        img.onload = () => {
                            const col = i % cols;
                            const row = Math.floor(i / cols);
                            
                            const x = col * cellWidth;
                            const y = row * cellHeight;

                            // Вписываем картинку в ячейку с сохранением пропорций (object-fit: cover)
                            const imgAspect = img.width / img.height;
                            const cellAspect = cellWidth / cellHeight;
                            
                            let renderWidth = cellWidth;
                            let renderHeight = cellHeight;
                            let offsetX = x;
                            let offsetY = y;

                            if (imgAspect > cellAspect) {
                                renderWidth = cellHeight * imgAspect;
                                offsetX = x - (renderWidth - cellWidth) / 2;
                            } else {
                                renderHeight = cellWidth / imgAspect;
                                offsetY = y - (renderHeight - cellHeight) / 2;
                            }

                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(x, y, cellWidth, cellHeight);
                            ctx.clip();
                            
                            ctx.drawImage(img, offsetX, offsetY, renderWidth, renderHeight);
                            ctx.restore();

                            resolve();
                        };
                        img.onerror = reject;
                        reader.readAsDataURL(selectedFiles[i]);
                    });
                }

                const dataUrl = canvas.toDataURL('image/png');
                resultImage.src = dataUrl;
                downloadBtn.href = dataUrl;
                resultContainer.classList.remove('hidden');
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error(error);
                alert('Произошла ошибка при создании сетки.');
            } finally {
                stitchBtn.textContent = 'Собрать в сетку 3×3';
                stitchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
